name: CI y despliegue a GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests unitarios (Vitest)
        run: npm test

      - name: Build de producción (typecheck + Vite)
        run: npm run build

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests e2e (Playwright sobre el build)
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Capturas de QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-screenshots
          path: qa-screenshots
          if-no-files-found: ignore

      - name: Configurar Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Subir artefacto de Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
