name: Servicio de salas

# El servicio de salas del cooperativo (server/salas) en Cloudflare Workers: se prueba y se despliega cuando cambia.
# Necesita los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID; TURN_KEY_ID y TURN_KEY_API_TOKEN activan el relé.
# Sin token, solo prueba y lo avisa (no falla).
on:
  push:
    branches: [main]
    paths:
      - 'server/salas/**'
      - 'src/net/lobbyProtocol.ts'
      - 'tests/unit/lobby.test.ts'
      - '.github/workflows/salas.yml'
  workflow_dispatch:

# Solo lectura: el despliegue usa el token de Cloudflare, no el de GitHub.
permissions:
  contents: read

concurrency:
  group: salas
  cancel-in-progress: false

jobs:
  deploy:
    name: Probar y desplegar el servicio de salas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_TURN: ${{ secrets.TURN_KEY_ID != '' && secrets.TURN_KEY_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas del servicio
        run: npx vitest run tests/unit/lobby.test.ts

      - name: Desplegar con relé
        if: env.HAS_TOKEN == 'true' && env.HAS_TURN == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.166.0'
          workingDirectory: server/salas
          secrets: |
            TURN_KEY_ID
            TURN_KEY_API_TOKEN
        env:
          TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
          TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}

      - name: Desplegar sin relé
        if: env.HAS_TOKEN == 'true' && env.HAS_TURN != 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.166.0'
          workingDirectory: server/salas

      - name: Sin token de Cloudflare
        if: env.HAS_TOKEN != 'true'
        run: 'echo "::notice::Faltan los secretos de Cloudflare; el servicio de salas se ha probado pero no se despliega."'
